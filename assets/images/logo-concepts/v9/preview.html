<!doctype html><meta charset="utf-8"><title>Fortia icon v9</title>
<style>
body{font-family:-apple-system,sans-serif;background:#F1E9DE;color:#262135;margin:24px}
h2{font-size:15px;margin:24px 0 12px}
.row{display:flex;gap:20px;flex-wrap:wrap}
figure{margin:0;width:200px;font-size:12px;line-height:1.4}
.big{width:200px;height:200px;border-radius:45px;display:block;margin-bottom:8px;box-shadow:0 0 0 1px #0001}
.phone{background:linear-gradient(160deg,#2b3a55,#6b4f6e);border-radius:28px;padding:18px 14px 22px;width:300px}
.phone.light{background:linear-gradient(160deg,#dfe7f2,#f3e6ee)}.phone.light .label,.phone.light .app{color:#262135}
.label{color:#fff;font-size:12px;opacity:.8;margin-bottom:12px}
.grid{display:flex;justify-content:space-between}
.app{display:flex;flex-direction:column;align-items:center;gap:5px;color:#fff;font-size:11px}
.ic{width:60px;height:60px;border-radius:14px;display:block}
</style>
<h2>Icons</h2><div class="row"><figure><img src="a-big-wordmark-icon.svg" class="big"><figcaption><b>A · Original colors</b><br>For comparison.</figcaption></figure><figure><img src="h-light-icon.svg" class="big"><figcaption><b>Light · tan on white</b><br>Brand tan (#E3BBA1) on white. Soft, but low contrast.</figcaption></figure><figure><img src="h-light-deep-icon.svg" class="big"><figcaption><b>Light · deeper tan on white</b><br>Slightly darker tan (#D4A07E) so it reads better on white.</figcaption></figure><figure><img src="h-dark-icon.svg" class="big"><figcaption><b>Dark · tan on black</b><br>Brand tan on black, for dark mode.</figcaption></figure></div>
<h2>On the home screen (60pt, real size)</h2><div class="row"><div class="phone dark"><div class="label">A · Original colors</div><div class="grid"><div class="app"><div class="ic" style="background:#4CD964"></div><span>App</span></div><div class="app"><img class="ic" src="a-big-wordmark-icon.svg"><span>Fortia</span></div><div class="app"><div class="ic" style="background:#5AC8FA"></div><span>App</span></div><div class="app"><div class="ic" style="background:#FF9500"></div><span>App</span></div></div></div><div class="phone light"><div class="label">Light · tan on white</div><div class="grid"><div class="app"><div class="ic" style="background:#4CD964"></div><span>App</span></div><div class="app"><img class="ic" src="h-light-icon.svg"><span>Fortia</span></div><div class="app"><div class="ic" style="background:#5AC8FA"></div><span>App</span></div><div class="app"><div class="ic" style="background:#FF9500"></div><span>App</span></div></div></div><div class="phone light"><div class="label">Light · deeper tan on white</div><div class="grid"><div class="app"><div class="ic" style="background:#4CD964"></div><span>App</span></div><div class="app"><img class="ic" src="h-light-deep-icon.svg"><span>Fortia</span></div><div class="app"><div class="ic" style="background:#5AC8FA"></div><span>App</span></div><div class="app"><div class="ic" style="background:#FF9500"></div><span>App</span></div></div></div><div class="phone dark"><div class="label">Dark · tan on black</div><div class="grid"><div class="app"><div class="ic" style="background:#4CD964"></div><span>App</span></div><div class="app"><img class="ic" src="h-dark-icon.svg"><span>Fortia</span></div><div class="app"><div class="ic" style="background:#5AC8FA"></div><span>App</span></div><div class="app"><div class="ic" style="background:#FF9500"></div><span>App</span></div></div></div></div>
